[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ftdi-core-research"
version = "0.4.1"
description = "FTDI audit-first local research core; no trading"
requires-python = ">=3.10"
license = {text = "Research prototype; internal evaluation only"}

[tool.setuptools.packages.find]
include = ["ftdi_core*"]
